<!DOCTYPE html>
<html lang="pt-BR" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gastos — cartão de crédito</title>
<meta name="description" content="Controle de gastos do cartão de crédito: categorias, relatórios mensais e parcelas futuras. Os dados ficam só neste navegador.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F0E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Gastos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239A2B4F'/%3E%3Crect x='12' y='20' width='40' height='26' rx='4' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M12 30h40' stroke='%23fff' stroke-width='5'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand"><span class="brand-mark" aria-hidden="true">G</span> Gastos</div>
    <button class="icon-btn" id="btn-theme" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro">◐</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Seções">
    <button class="tab" type="button" data-route="mes">Mês</button>
    <button class="tab" type="button" data-route="relatorios">Relatórios</button>
    <button class="tab" type="button" data-route="eventos">Eventos</button>
    <button class="tab" type="button" data-route="parcelas">Parcelas</button>
    <button class="tab" type="button" data-route="importar">Importar</button>
    <button class="tab" type="button" data-route="ajustes">Ajustes</button>
  </nav>
</header>

<main class="app" id="view" tabindex="-1">
  <noscript>
    <div class="card"><h2>Ative o JavaScript</h2>
    <p class="card-sub">Este app roda inteiro no seu navegador e precisa de JavaScript para funcionar.</p></div>
  </noscript>
</main>

<button class="fab" id="fab" type="button">＋ Novo gasto</button>

<div class="pwa-bar" id="pwa-atualizar" role="status" hidden>
  <div class="pwa-bar-inner">
    <span class="pwa-bar-txt">Uma versão nova do app está pronta.</span>
    <button class="btn small primary" type="button" id="pwa-atualizar-btn">Atualizar</button>
    <button class="icon-btn" type="button" id="pwa-atualizar-fechar" aria-label="Agora não">✕</button>
  </div>
</div>

<div class="tip" id="tip" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="modal" id="modal"><div class="modal-card" id="modal-card"></div></dialog>

<script src="app.js"></script>
</body>
</html>
